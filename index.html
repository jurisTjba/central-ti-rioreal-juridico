<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Sistemas — Comarca de Rio Real</title>
<style>
  :root {
    --bg: #f3f4f6; --surface: #fff; --text: #1a2330; --muted: #5a6573; --line: #d9dee5;
    --topo: #0f2a47; --topo-text: #fff; --brand: #0f2a47; --btn: #0f2a47; --btn-text: #fff;
    --ok: #1d7a55; --restrito: #a86a00; --breve: #7a8494; --aviso-bg: #fdf4e0; --aviso-line: #a86a00;
    --erro: #b3261e;
    --admin: #b08d3c; --admin-bg: #f6f1e6;
    --serif: Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e141b; --surface: #161e28; --text: #e4e9ef; --muted: #98a4b3; --line: #293442;
      --topo: #0a1522; --brand: #9cc3ee; --btn: #9cc3ee; --btn-text: #0a1522;
      --ok: #5fc79d; --restrito: #e6b450; --breve: #8a96a6; --aviso-bg: #2b2412; --aviso-line: #e6b450; --erro: #ff8a80;
      --admin-bg: #151410;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, "Segoe UI", sans-serif; }
  a { color: var(--brand); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

  .topo { background: var(--topo); color: var(--topo-text); border-bottom: 3px solid #b08d3c; }
  .topo .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 16px; }
  .topo a { color: inherit; text-decoration: none; font: 700 1.2rem var(--serif); letter-spacing: .01em; }
  .topo span { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .topo :focus-visible { outline-color: #fff; }
  /* área restrita: fundo tingido, selo no cabeçalho e faixa mais grossa */
  .selo-admin { display: none; font: 700 .72rem system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; opacity: 1;
                padding: 3px 9px; border-radius: 999px; background: var(--admin); color: #1a1200; }
  body[data-area="admin"] { background: var(--admin-bg); }
  body[data-area="admin"] .selo-admin { display: inline-block; }
  body[data-area="admin"] .topo { border-bottom-width: 6px; }

  main { padding-block: 32px 64px; }
  h1, h2 { font-family: var(--serif); font-weight: 700; line-height: 1.25; }
  h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 8px; }
  h2 { font-size: 1.3rem; margin: 48px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); scroll-margin-top: 16px; }
  h3.secao { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; max-width: 68ch; }
  .status { font-size: .82rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--breve); }
  .status.ok::before { background: var(--ok); }
  .status.restrito::before { background: var(--restrito); }

  /* catálogo */
  .busca { width: 100%; padding: 13px 16px; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .filtros { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .chip { font-size: .82rem; padding: 3px 10px; background: transparent; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
  .chip:hover { border-color: var(--brand); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-text); }
  .conta { font-size: .85rem; color: var(--muted); margin: 20px 0 10px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 20px; background: var(--surface); border: 1px solid var(--line);
          border-radius: 6px; text-decoration: none; color: inherit; transition: border-color .15s, box-shadow .15s; }
  .card:hover { border-color: var(--brand); box-shadow: 0 2px 10px rgb(0 0 0 / .08); }
  .card .tipo { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .card h3 { margin: 0; font: 700 1.1rem/1.3 var(--serif); color: var(--brand); }
  .card p { margin: 0; color: var(--muted); font-size: .92rem; flex: 1; }
  .card footer { display: flex; justify-content: space-between; gap: 8px; padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
  .vazio { color: var(--muted); padding: 24px 0; }

  /* detalhe */
  .voltar { display: inline-block; margin-bottom: 16px; text-decoration: none; font-size: .92rem; }
  .hero { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--brand); border-radius: 6px; padding: 28px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .85rem; color: var(--muted); margin-bottom: 14px; }
  .acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 4px; }
  .btn { display: inline-block; padding: 15px 30px; font-size: 1.1rem; font-weight: 700; background: var(--btn); color: var(--btn-text);
         border: 2px solid var(--btn); border-radius: 6px; text-decoration: none; }
  .btn:hover { filter: brightness(1.15); }
  .btn.sec { background: transparent; color: var(--brand); font-size: 1rem; font-weight: 600; padding: 12px 20px; border-width: 1px; }
  .btn[aria-disabled="true"] { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; filter: none; }
  .nota { font-size: .88rem; color: var(--muted); margin: 14px 0 0; max-width: 68ch; }
  .secoes { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 16px; font-size: .9rem; }
  .secoes button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; color: var(--muted); }
  .secoes button:hover { color: var(--text); border-color: var(--brand); }

  ol.passos { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  ol.passos li { display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding: 18px 20px; }
  ol.passos li + li { border-top: 1px solid var(--line); }
  ol.passos .n { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--brand);
                 color: var(--brand); font: 700 .95rem var(--serif); }
  ol.passos strong { display: block; }
  ol.passos p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; max-width: 68ch; }
  .fig { display: block; margin: 12px 0 0; padding: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; overflow: hidden; max-width: 100%; }
  .fig img { display: block; max-width: 100%; max-height: 340px; height: auto; }
  .aviso { background: var(--aviso-bg); border-left: 3px solid var(--aviso-line); padding: 12px 16px; margin: 0 0 16px; border-radius: 0 4px 4px 0; font-size: .95rem; }

  details { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
  summary { padding: 13px 18px; font-weight: 600; cursor: pointer; }
  details p { margin: 0; padding: 0 18px 14px; color: var(--muted); }

  .versao { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .versao .quando { font-size: .88rem; color: var(--muted); }
  .versao .quando b { display: block; color: var(--text); font-size: 1rem; }
  .versao .atual { display: inline-block; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ok); font-weight: 700; }
  .versao ul { margin: 0; padding-left: 18px; }
  .github { font-size: .9rem; color: var(--muted); margin: -8px 0 16px; }

  dialog { padding: 0; border: 0; background: transparent; max-width: 96vw; max-height: 96vh; }
  dialog::backdrop { background: rgb(0 0 0 / .8); }
  dialog img { display: block; max-width: 96vw; max-height: 92vh; cursor: zoom-out; border-radius: 4px; }

  /* atividades (pública) */
  .topo .nav-topo { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
  .topo .nav-topo a { font: 600 .9rem system-ui, "Segoe UI", sans-serif; letter-spacing: 0; opacity: .85; }
  .topo .nav-topo a:hover { opacity: 1; text-decoration: underline; }
  .resumo { display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: .9rem; color: var(--muted); margin: 0 0 8px; }
  .resumo b { color: var(--text); font: 700 1.15rem var(--serif); }
  .filtros.sistemas { margin: 0 0 20px; }
  .secao.mes { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 10px 0 6px; margin: 16px 0 8px; }
  .lista { list-style: none; margin: 0 0 24px; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  .lista li { display: grid; grid-template-columns: 56px 1fr; gap: 0 14px; padding: 14px 18px; align-items: start; }
  .lista li + li { border-top: 1px solid var(--line); }
  .lista time.quando { display: grid; justify-items: center; line-height: 1.1; padding-top: 2px; color: var(--muted); font-size: .7rem; letter-spacing: .04em; text-transform: uppercase; }
  .lista time.quando b { font: 700 1.4rem/1 var(--serif); color: var(--brand); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
  .lista .corpo { display: grid; gap: 4px; min-width: 0; }
  .lista .cab { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
  .lista .titulo { font-weight: 600; }
  .lista .desc { margin: 0; color: var(--muted); font-size: .92rem; white-space: pre-line; max-width: 68ch; }
  .tag.andamento { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }

  /* badges */
  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { display: inline-block; font-size: .74rem; font-weight: 600; letter-spacing: .02em; padding: 2px 9px; border-radius: 999px;
         background: var(--bg); border: 1px solid var(--line); color: var(--muted); text-decoration: none; white-space: nowrap; }
  .tag.link { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 40%, transparent); }
  .tag.link:hover { background: var(--brand); color: var(--btn-text); }
  .tag.prazo { color: var(--restrito); border-color: color-mix(in srgb, var(--restrito) 45%, transparent); }

  /* administração */
  .sessao { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: .9rem; color: var(--muted); margin-bottom: 16px; }
  .sessao .ops { display: flex; gap: 8px; }
  .btn.mini { padding: 7px 13px; font-size: .85rem; font-weight: 600; border-width: 1px; line-height: 1.2; }
  .btn.perigo { color: var(--erro); border-color: var(--erro); background: transparent; }
  .btn.perigo-solido { background: var(--erro); border-color: var(--erro); color: #fff; }
  .btn.grande { padding: 16px 34px; font-size: 1.1rem; min-width: 170px; }
  .btn:disabled { opacity: .55; cursor: wait; }
  .abas { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 20px 0 18px; }
  .abas button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 10px 14px; color: var(--muted); font-weight: 600; }
  .abas button:hover { color: var(--text); }
  .abas button[aria-selected="true"] { color: var(--brand); border-color: var(--brand); }
  .abas .n { display: inline-block; min-width: 1.6em; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); font-size: .78rem; text-align: center; }
  .barra { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .barra .sub { margin: 0; }
  .cartoes { display: grid; gap: 10px; margin-bottom: 20px; }
  .cartao { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; }
  .cartao.pendente { border-left-color: var(--restrito); }
  .cartao.rodando { border-left-color: var(--ok); }
  .cartao header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .cartao h3 { margin: 0 0 6px; font: 700 1.05rem/1.3 var(--serif); color: var(--text); }
  .cartao .tempo { flex: none; font: 700 1.2rem/1 var(--serif); color: var(--brand); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cartao .tempo.ativo { color: var(--ok); }
  .cartao .tempo small { display: block; font: 500 .7rem/1.4 system-ui, sans-serif; color: var(--muted); text-align: right; letter-spacing: .04em; text-transform: uppercase; }
  .cartao .desc { margin: 0; color: var(--muted); font-size: .92rem; white-space: pre-line; max-width: 72ch; }
  .cartao footer { display: flex; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; align-items: center; padding-top: 10px; border-top: 1px solid var(--line); }
  .cartao .principais, .cartao .secundarias { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn.concluir { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.texto { background: none; border-color: transparent; color: var(--muted); padding: 7px 8px; font-size: .85rem; font-weight: 600; }
  .btn.texto:hover { color: var(--text); background: var(--bg); filter: none; }
  .btn.texto.perigo:hover { color: var(--erro); }
  .vazio-caixa { display: grid; justify-items: center; gap: 6px; padding: 36px 20px; text-align: center; color: var(--muted);
                 background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; }
  .vazio-caixa .icone { color: var(--brand); opacity: .7; line-height: 0; }
  .vazio-caixa h3 { margin: 6px 0 0; font: 700 1.1rem var(--serif); color: var(--text); }
  .vazio-caixa p { margin: 0; max-width: 44ch; }
  .vazio-caixa .acoes { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; margin-top: 12px; }
  .vazio-caixa .acoes .nota { margin: 0; }

  /* registradas: meses recolhíveis com cabeçalho fixo */
  details.mes { background: transparent; border: 0; margin: 0 0 6px; }
  details.mes > summary { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; list-style: none;
                          padding: 10px 4px; background: var(--admin-bg); border-bottom: 1px solid var(--line);
                          font: 700 .8rem system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  details.mes > summary::-webkit-details-marker { display: none; }
  details.mes > summary::before { content: "▸"; margin-right: 8px; display: inline-block; transition: transform .15s; }
  details.mes[open] > summary::before { transform: rotate(90deg); }
  details.mes > summary .meta { font-weight: 500; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  details.mes .cartoes { padding-top: 10px; }
  details.mes[hidden] { display: none; }

  /* configuração pendente (só o administrador vê o guia) */
  .config-pendente { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--restrito); border-radius: 8px; padding: 22px 24px; max-width: 64ch; }
  .config-pendente .selo-config { margin: 0 0 4px; font: 700 .72rem system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--restrito); }
  .config-pendente h2 { margin: 0 0 8px; padding: 0; border: 0; font-size: 1.25rem; }
  .config-pendente p { margin: 0 0 8px; }
  .config-pendente ol { padding-left: 20px; margin: 10px 0; }
  .config-pendente pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; overflow: auto; font-size: .85rem; margin: 0 0 12px; }

  /* formulários e modais */
  .form { display: grid; gap: 14px; }
  .form label, .form .campo { display: grid; gap: 4px; font-size: .88rem; font-weight: 600; }
  .form input, .form textarea, .form select { font: inherit; font-weight: 400; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 9px 12px; width: 100%; }
  .form textarea { min-height: 84px; resize: vertical; }
  .form .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form .tempo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-weight: 400; }
  .form .tempo input { width: 84px; }
  .form .acoes { margin: 0; }
  .erro { color: var(--erro); font-size: .9rem; margin: 0; }
  .form.pagina { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px; max-width: 420px; }
  dialog.modal { padding: 0; border: 0; background: transparent; }
  dialog.modal::backdrop { background: rgb(0 0 0 / .55); backdrop-filter: blur(2px); }
  .caixa { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 24px; width: min(560px, 94vw); max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgb(0 0 0 / .3); }
  .caixa h2 { margin: 0 0 2px; padding: 0; border: 0; font-size: 1.3rem; }
  .caixa .sub { margin: 0 0 6px; font-size: .9rem; }
  .acoes-modal { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .acoes-modal [data-continuar] { order: -1; }
  .dica-modal { margin: 2px 0 0; font-size: .8rem; color: var(--muted); text-align: right; }
  .dica-modal kbd, .toast-acao kbd { font: inherit; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--topo); color: #fff;
           padding: 10px 18px; border-radius: 999px; font-size: .9rem; box-shadow: 0 6px 20px rgb(0 0 0 / .25); transition: opacity .2s, transform .2s; z-index: 50; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast-acao { margin-left: 12px; background: none; border: 0; padding: 0; color: #ffd98a; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

  /* modo foco */
  .foco { min-height: calc(100vh - 140px); display: grid; grid-template-rows: auto 1fr; }
  /* o estado (parado | rodando | pausado | finalizado) vai em data-estado e define a cor de tudo */
  .foco-centro { --tom: var(--muted); display: grid; place-items: center; align-content: center; text-align: center; gap: 18px; padding: 24px 0 48px; border-radius: 12px; transition: background .4s; }
  .foco-centro[data-estado="rodando"] { --tom: var(--ok); background: radial-gradient(ellipse at 50% 40%, color-mix(in srgb, var(--ok) 9%, transparent), transparent 60%); }
  .foco-centro[data-estado="pausado"], .foco-centro[data-estado="finalizado"] { --tom: var(--restrito); }
  .foco-tarefa { margin: 0; color: var(--muted); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; display: grid; gap: 8px; justify-items: center; }
  .foco-tarefa strong { font: 700 1.3rem/1.3 var(--serif); color: var(--text); letter-spacing: 0; text-transform: none; max-width: 30ch; }
  .foco-tarefa .dica { text-transform: none; letter-spacing: 0; }
  .foco-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: .9rem;
               color: var(--tom); border: 1.5px solid var(--tom); background: color-mix(in srgb, var(--tom) 10%, transparent); transition: color .3s, border-color .3s; }
  .foco-chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--tom); }
  .foco-centro[data-estado="rodando"] .foco-chip::before { animation: pulso 1.6s ease-in-out infinite; }
  .relogio { font: 700 clamp(3.4rem, 15vw, 7.5rem)/1 ui-monospace, "Cascadia Mono", Consolas, monospace; font-variant-numeric: tabular-nums; letter-spacing: .02em; color: var(--tom); transition: color .3s; }
  .foco-centro[data-estado="parado"] .relogio { color: var(--text); }
  .foco-sessao { margin: -8px 0 0; font-size: .95rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .foco-sessao b { color: var(--text); }
  @keyframes pulso { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 50%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }
  .foco-acoes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .foco-dica { margin: 0; font-size: .85rem; color: var(--muted); max-width: 46ch; }
  .foco-dica kbd { font: inherit; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
  /* botão de segurar: --p vai de 0 a 1 por requestAnimationFrame (funciona mesmo com movimento reduzido) */
  .segurar { --p: 0; position: relative; overflow: hidden; isolation: isolate; user-select: none; -webkit-user-select: none; touch-action: none; min-width: 11ch; }
  .segurar::before { content: ""; position: absolute; inset: 0; z-index: -1; transform-origin: left; transform: scaleX(var(--p)); background: color-mix(in srgb, var(--erro) 30%, transparent); }
  .segurar.segurando { border-color: var(--erro); color: var(--erro); }
  @media (prefers-reduced-motion: reduce) { .foco-chip::before { animation: none !important; } }

  @media (max-width: 560px) {

const app = document.getElementById('app');
const zoom = document.getElementById('zoom');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const norm = s => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
const dataBR = iso => iso.split('-').reverse().join('/');
const LOGS = {}; // slug -> versões lidas de changelog/<slug>.md
// Markdown mínimo: blocos "## 0.6.0 — 2026-09-11" ou "## 2026-09-11", seguidos de linhas "- ..."
const parseMd = md => md.split(/^## /m).slice(1).map(bloco => {
  const [cab, ...linhas] = bloco.trim().split('\n');
  const data = cab.match(/\d{4}-\d{2}-\d{2}/)?.[0];
  const versao = cab.replace(data ?? '', '').replace(/[\s—–-]+$/, '').trim() || undefined;
  const notas = linhas.filter(l => l.startsWith('- ')).map(l => l.slice(2).trim());
  return { versao, data, notas };
}).filter(v => v.data && v.notas.length);
const lerMd = url => fetch(url, { cache: 'no-cache' }).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(parseMd);
const ordenadas = p => [...(LOGS[p.slug] || p.versoes || [])].sort((a, b) => b.data.localeCompare(a.data));
const status = p => `<span class="status ${esc(p.status.tipo)}">${esc(p.status.rotulo)}</span>`;
const rotuloVersao = v => v.versao ? `v${esc(v.versao)}` : dataBR(v.data);

function card(p) {
  const v = ordenadas(p)[0];
  return `<a class="card" href="#/${esc(p.slug)}">
    <span class="tipo">${esc(p.tipo)}</span><h3>${esc(p.nome)}</h3><p>${esc(p.resumo)}</p>
    <footer>${status(p)}<span>${v ? `Atualizado em ${dataBR(v.data)}` : ''}</span></footer></a>`;
}

function catalogo() {
  document.title = 'Central de Sistemas — Comarca de Rio Real';
  const tags = [...new Set(PROJETOS.flatMap(p => p.tags))].sort((a, b) => a.localeCompare(b, 'pt'));
  app.innerHTML = `<h1>Sistemas e projetos da comarca</h1>
    <p class="sub">Links oficiais, instruções de uso e histórico de atualizações de cada sistema, em um só lugar.</p>
    <input class="busca" type="search" placeholder="Buscar por nome ou tag…" aria-label="Buscar sistema por nome ou tag">
    <div class="filtros" role="group" aria-label="Filtrar por tag">${tags.map(t => `<button class="chip" aria-pressed="false">${esc(t)}</button>`).join('')}</div>
    <p class="conta" aria-live="polite"></p><div class="grade"></div>`;
  const busca = app.querySelector('.busca'), grade = app.querySelector('.grade'), conta = app.querySelector('.conta');
  let tag = null;
  const filtrar = () => {
    const termo = norm(busca.value.trim());
    const achados = PROJETOS.filter(p => (!tag || p.tags.includes(tag)) && norm(p.nome + ' ' + p.tags.join(' ')).includes(termo));
    conta.textContent = `${achados.length} ${achados.length === 1 ? 'sistema' : 'sistemas'}`;
    grade.innerHTML = achados.map(card).join('') || '<p class="vazio">Nenhum sistema encontrado. Tente outro termo ou limpe o filtro.</p>';
  };
  busca.addEventListener('input', filtrar);
  app.querySelector('.filtros').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    tag = tag === chip.textContent ? null : chip.textContent;
    app.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.textContent === tag));
    filtrar();
  });
  filtrar();
}

  let n = 0; // numeração contínua entre as seções do guia
  const guia = p.guia.map(g => `${g.secao ? `<h3 class="secao">${esc(g.secao)}</h3>` : ''}

      ${img ? `<button class="fig" aria-label="Ampliar imagem: ${esc(t)}"><img src="${esc(img)}" alt="Tela: ${esc(t)}" loading="lazy"></button>` : ''}
    </div></li>`).join('')}</ol>`).join('');
  app.innerHTML = `<a class="voltar" href="#/">← Todos os sistemas</a>
    <section class="hero">
      <div class="meta">${status(p)}<span>${esc(p.tipo)}</span>${versoes[0] ? `<span>Versão atual: ${rotuloVersao(versoes[0])}</span><span>Atualizado em ${dataBR(versoes[0].data)}</span>` : ''}</div>
      <h1>${esc(p.nome)}</h1>
      <p class="sub">${esc(p.resumo)}</p>
      <div class="acoes">${botao}${p.alt ? `<a class="btn sec" href="${esc(p.alt.url)}" ${p.alt.arquivo ? 'download' : 'target="_blank" rel="noopener"'}>${esc(p.alt.rotulo)}</a>` : ''}</div>

    </section>

      <button data-ir="como">Como funciona</button>${p.faq ? '<button data-ir="faq">Problemas comuns</button>' : ''}<button data-ir="versoes">Histórico de versões</button>
    </nav>
    <h2 id="como">Como funciona</h2>
    ${p.aviso ? `<p class="aviso"><strong>Atenção:</strong> ${esc(p.aviso)}</p>` : ''}
    ${guia}
    ${p.faq ? `<h2 id="faq">Problemas comuns</h2>${p.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}` : ''}
    <h2 id="versoes">Histórico de versões</h2>
    ${p.repo ? `<p class="github">Fonte: <a href="https://github.com/${esc(p.repo)}/blob/main/CHANGELOG.md" target="_blank" rel="noopener">CHANGELOG.md</a> · <a href="https://github.com/${esc(p.repo)}/commits/main" target="_blank" rel="noopener">commits no GitHub ↗</a></p>` : ''}
    ${versoes.length ? '' : '<p class="vazio">Nenhuma versão publicada ainda.</p>'}

const SB = window.SUPABASE || {};

    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm');
    _sb = createClient(SB.url, SB.anonKey);

}
const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const segundosDe = a => a.segundos + (a.timer_inicio ? Math.max(0, Math.round((Date.now() - new Date(a.timer_inicio)) / 1000)) : 0);
const fmtHoras = s => { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${String(m).padStart(2, '0')}min` : s > 0 && s < 60 ? '<1min' : `${m}min`; };
const fmtCron = s => [s / 3600, s % 3600 / 60, s % 60].map(x => String(Math.floor(x)).padStart(2, '0')).join(':');
const mesExtenso = am => { const t = new Date(am + '-01T12:00').toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return t[0].toUpperCase() + t.slice(1); };
const nomeSistema = slug => PROJETOS.find(p => p.slug === slug)?.nome;

function atualizarCronometros(lista) {

  alvo.innerHTML = `${chips}<div id="lista-pub">${listaAgrupada(lista)}</div><p class="nota"><a href="#/admin">Área do administrador</a></p>`;

}

// aviso curto; com { acao, aoClicar } ganha um botão (ex.: "Desfazer") e fica mais tempo na tela
function toast(msg, { acao, aoClicar, ms } = {}) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.innerHTML = esc(msg) + (acao ? ` <button type="button" class="toast-acao">${esc(acao)}</button>` : '');
  t.querySelector('.toast-acao')?.addEventListener('click', () => { t.classList.remove('on'); aoClicar?.(); });
  t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), ms ?? (acao ? 6000 : 2600));
}

function abrirModal(html) {
  const d = document.createElement('dialog');
  d.className = 'modal'; d.innerHTML = html;
  document.body.append(d);
  // clique no fundo fecha, exceto se há um formulário com texto digitado (data-sujo)
  d.addEventListener('click', e => { if (e.target === d && !d.querySelector('form[data-sujo]')) d.close(); });
  d.addEventListener('close', () => d.remove());
  d.showModal();
  return d;
}

// caixa de confirmação; resolve true só se o usuário confirmar
function confirmar({ titulo, texto, rotulo = 'Confirmar', perigo = false }) {
  return new Promise(res => {
    const d = abrirModal(`<form method="dialog" class="caixa">
      <h2>${esc(titulo)}</h2><p class="sub">${esc(texto)}</p>
      <div class="acoes-modal"><button class="btn sec" value="nao" type="submit">Cancelar</button>
      <button class="btn${perigo ? ' perigo-solido' : ''}" value="sim" type="submit" autofocus>${esc(rotulo)}</button></div></form>`);
    d.addEventListener('close', () => res(d.returnValue === 'sim'));
  });
}

// botão que precisa ser segurado por `ms` para disparar. A conclusão é por temporizador; o preenchimento
// visual vai em --p (0 a 1) por requestAnimationFrame, então aparece mesmo com movimento reduzido.
// Esc cancela; teclado cai na confirmação em caixa.
function segurar(btn, ms, fn, confirmacao) {
  const rotulo = btn.textContent;
  let inicio = null, raf = null, fim = null, ponteiro = null;
  const parar = () => {
    cancelAnimationFrame(raf); clearTimeout(fim); inicio = null;
    btn.classList.remove('segurando'); btn.style.setProperty('--p', 0); btn.textContent = rotulo;
    if (ponteiro !== null) { try { btn.releasePointerCapture(ponteiro); } catch {} ponteiro = null; }
  };
  const passo = agora => {
    if (inicio === null) return;
    btn.style.setProperty('--p', Math.min(1, (agora - inicio) / ms));
    raf = requestAnimationFrame(passo);
  };
  btn.addEventListener('pointerdown', e => {
    if (e.button !== 0 || inicio !== null) return;
    ponteiro = e.pointerId;
    try { btn.setPointerCapture(e.pointerId); } catch {} // mantém o gesto mesmo se o dedo/mouse sair um pouco do botão
    btn.classList.add('segurando'); btn.textContent = 'Segure…';
    inicio = performance.now(); raf = requestAnimationFrame(passo);
    fim = setTimeout(() => { parar(); navigator.vibrate?.(30); fn(); }, ms);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => btn.addEventListener(ev, parar));
  btn.addEventListener('keydown', async e => {
    if (e.key === 'Escape') return parar();
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    if (await confirmar(confirmacao)) fn();
  });
}

// formulário de atividade em modal. modo: 'pendente' (rápido) | 'lancar' (completo) | 'editar'
// resolve true quando salvou. aoSalvar é chamado a cada item salvo (o modo pendente permite salvar vários sem fechar).
// Teclado: Enter salva; Ctrl+Enter salva de qualquer campo (inclusive da descrição); Ctrl+Shift+Enter salva e continua.
function modalAtividade(sb, { modo, atividade = null, segundos = 0, aoSalvar = null }) {
  const a = atividade || {};
  const completo = modo !== 'pendente';
  const s = atividade ? segundosDe(atividade) : segundos;
  const opcoes = `<option value="">— nenhum —</option><option value="geral">Geral (sem sistema específico)</option>${PROJETOS.map(p => `<option value="${esc(p.slug)}">${esc(p.nome)}</option>`).join('')}`;
  const titulos = { pendente: 'Nova pendência', lancar: 'Lançar atividade', editar: 'Editar atividade' };
  const subs = { pendente: 'Anote o que falta fazer. Só você vê as pendências.', lancar: 'Registre uma atividade já concluída, com o tempo que levou.', editar: '' };
  const sistema = `<label>Sistema relacionado<select name="sistema">${opcoes}</select></label>`;
  const html = `<form class="caixa form" novalidate>
    <h2>${titulos[modo]}</h2>${subs[modo] ? `<p class="sub">${subs[modo]}</p>` : ''}
    <label>Nome<input name="nome" required maxlength="120" value="${esc(a.nome || '')}" placeholder="${modo === 'pendente' ? 'Ex.: Atualizar o Fórum Hub' : 'Ex.: Atualização do Fórum Hub'}"></label>
    ${completo ? `<div class="linha"><label>Data<input type="date" name="data" value="${esc(a.data || hoje())}" required></label>${sistema}</div>` : sistema}
    <label>Descrição<textarea name="descricao" placeholder="${modo === 'pendente' ? 'Detalhes, para quem, prazo…' : 'O que foi feito, para quem, resultado…'}">${esc(a.descricao || '')}</textarea></label>
    ${completo ? `<div class="campo"><span>Tempo trabalhado</span><span class="tempo">
        <input type="number" name="h" min="0" step="1" value="${Math.floor(s / 3600)}" aria-label="Horas"> h
        <input type="number" name="m" min="0" max="59" step="1" value="${Math.floor(s % 3600 / 60)}" aria-label="Minutos"> min</span></div>` : ''}
    ${modo === 'editar' ? `<label>Situação<select name="status"><option value="concluida">Concluída (aparece na página pública)</option><option value="pendente">Pendente (só o administrador vê)</option></select></label>` : ''}
    <p class="erro" hidden></p>
    <div class="acoes-modal"><button type="button" class="btn sec" data-fechar>Cancelar</button>
      <button class="btn" type="submit">${modo === 'pendente' ? 'Adicionar' : 'Salvar'}</button>
      ${modo === 'pendente' ? '<button class="btn sec" type="submit" data-continuar title="Ctrl+Shift+Enter">Adicionar e continuar</button>' : ''}</div>
    ${modo === 'pendente' ? '<p class="dica-modal"><kbd>Enter</kbd> adiciona · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> adiciona de qualquer campo · <kbd>Esc</kbd> fecha</p>' : ''}
  </form>`;
  return new Promise(res => {
    const d = abrirModal(html), f = d.querySelector('form'), erro = f.querySelector('.erro');
    let salvo = false, continuar = false;
    let lembrado = ''; try { lembrado = localStorage.getItem('central-sistema') || ''; } catch {}
    f.sistema.value = a.sistema || (atividade ? '' : lembrado);
    if (f.status) f.status.value = a.status === 'pendente' ? 'pendente' : 'concluida';
    d.querySelector('[data-fechar]').addEventListener('click', () => d.close());
    d.addEventListener('close', () => res(salvo));
    f.addEventListener('input', () => { f.dataset.sujo = '1'; });
    f.addEventListener('click', e => { continuar = !!e.target.closest('[data-continuar]'); });
    f.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
      e.preventDefault(); continuar = e.shiftKey && modo === 'pendente'; f.requestSubmit();
    });
    f.addEventListener('submit', async e => {
      e.preventDefault(); erro.hidden = true;
      const nome = f.nome.value.trim();
      if (!nome || (completo && !f.data.value)) { erro.textContent = completo ? 'Informe o nome e a data.' : 'Informe o nome da pendência.'; erro.hidden = false; return; }
      const dados = { nome, descricao: f.descricao.value.trim() || null, sistema: f.sistema.value || null };
      if (completo) {
        dados.data = f.data.value;
        dados.segundos = (Number(f.h.value) || 0) * 3600 + (Number(f.m.value) || 0) * 60;
        dados.status = f.status ? f.status.value : 'concluida';
        if (atividade?.timer_inicio) dados.timer_inicio = new Date().toISOString(); // tempo digitado já inclui o decorrido
      } else { dados.status = 'pendente'; dados.data = hoje(); }
      f.querySelectorAll('[type=submit]').forEach(b => { b.disabled = true; });
      const { error } = atividade ? await sb.from('atividades').update(dados).eq('id', atividade.id) : await sb.from('atividades').insert(dados);
      f.querySelectorAll('[type=submit]').forEach(b => { b.disabled = false; });
      if (error) { erro.textContent = `Não foi possível salvar (${error.message}).`; erro.hidden = false; return; }
      try { localStorage.setItem('central-sistema', f.sistema.value); } catch {}
      salvo = true; aoSalvar?.();
      if (continuar) { // mantém o modal aberto para anotar a próxima pendência
        const sis = f.sistema.value; f.reset(); f.sistema.value = sis; delete f.dataset.sujo; continuar = false;
        f.nome.focus(); toast('Pendência adicionada. Anote a próxima.'); return;
      }
      res(true); d.close(); // resolve já, sem esperar o evento close (que só dispara quando a aba renderiza)
    });
    f.nome.focus();
  });
}

// pausa qualquer cronômetro de atividade que esteja rodando no banco
async function pausarTodos(sb, excetoId = null) {
  const { data, error } = await sb.from('atividades').select('*').not('timer_inicio', 'is', null);
  if (error) throw error;
  for (const a of data.filter(a => a.id !== excetoId)) {
    const { error: e2 } = await sb.from('atividades').update({ segundos: segundosDe(a), timer_inicio: null }).eq('id', a.id);
    if (e2) throw e2;
  }
}

async function concluirAtividade(sb, a) {
  const dados = { status: 'concluida', data: hoje() };
  if (a.timer_inicio) { dados.segundos = segundosDe(a); dados.timer_inicio = null; }
  const { error } = await sb.from('atividades').update(dados).eq('id', a.id);
  if (error) throw error;
}

// ---------- administração ----------
// cartão do painel: ações principais (Concluir, Focar) à esquerda, secundárias (Editar, Excluir) à direita como texto.
// Pendência sem tempo dedicado não mostra o bloco de horas.
function cartao(a) {
  const pend = a.status === 'pendente', s = segundosDe(a), rodando = !!a.timer_inicio;
  const tempo = pend && !s ? ''
    : `<span class="tempo${rodando ? ' ativo' : ''}" data-horas>${rodando ? '● ' : ''}${fmtHoras(s)}<small>${rodando ? 'em andamento' : pend ? 'já dedicado' : 'trabalhadas'}</small></span>`;
  return `<article class="cartao${pend ? ' pendente' : ''}${rodando ? ' rodando' : ''}" data-id="${esc(a.id)}">
    <header>
      <div><h3>${esc(a.nome)}</h3>
        <div class="tags">${tagSistema(a)}<span class="tag${pend ? ' prazo' : ''}">${pend ? 'anotada em ' : ''}${dataBR(a.data)}</span></div></div>
      ${tempo}
    </header>
    ${a.descricao ? `<p class="desc">${esc(a.descricao)}</p>` : ''}
    <footer>
      <div class="principais">
        ${pend ? '<button class="btn mini concluir" data-acao="concluir">✓ Concluir</button>' : ''}
        <a class="btn mini${pend ? ' sec' : ''}" href="#/foco/${esc(a.id)}">${rodando ? '◉ Ver no foco' : '▶ Focar'}</a>
      </div>
      <div class="secundarias">
        <button class="btn texto" data-acao="editar">Editar</button>
        <button class="btn texto perigo" data-acao="excluir">Excluir</button>
      </div>
    </footer>
  </article>`;
}

async function admin() {
  document.title = 'Administração — Central de Sistemas';
  app.innerHTML = telaCarregando();
  const sessao = await exigirSessao();
  if (!sessao) return;
  const { sb, session } = sessao;
  let aba = 'pendentes';
  try { aba = localStorage.getItem('central-aba') || 'pendentes'; } catch {}

  app.innerHTML = `<div id="adm">
    <div class="sessao"><span>Conectado como <b>${esc(session.user.email)}</b></span>
      <span class="ops"><a class="btn mini" href="#/foco">◉ Modo foco</a><button class="btn mini sec" id="sair">Sair</button></span></div>
    <h1>Painel de administração</h1>
    <p class="sub">Pendências só aparecem aqui. Atividades registradas são públicas.</p>
    <div class="abas" role="tablist">
      <button role="tab" data-aba="pendentes" aria-selected="false">Pendentes<span class="n" id="n-pend">…</span></button>
      <button role="tab" data-aba="registradas" aria-selected="false">Registradas<span class="n" id="n-reg">…</span></button>
    </div>
    <section id="painel-pendentes" role="tabpanel" hidden>
      <div class="barra"><p class="sub">O que ainda falta fazer, da anotação mais antiga para a mais nova.</p><button class="btn mini" data-novo="pendente" title="Atalho: N">＋ Nova pendência</button></div>
      <div id="lista-pendentes"></div>
    </section>
    <section id="painel-registradas" role="tabpanel" hidden>
      <p class="resumo" id="resumo-reg" hidden><span><b id="n-reg-total">0</b> atividades</span><span><b id="h-reg-total">0min</b> trabalhadas</span><span><b id="h-mes-total">0min</b> neste mês</span></p>
      <div class="barra"><p class="sub">Atividades concluídas, visíveis na página pública (que não mostra os tempos).</p><button class="btn mini" data-novo="lancar">＋ Lançar atividade manual</button></div>
      <input class="busca" id="filtro-reg" type="search" placeholder="Filtrar por nome, descrição ou sistema…" aria-label="Filtrar atividades registradas" hidden>
      <div id="lista-registradas"></div>
    </section>
  </div>`;

  const raiz = app.querySelector('#adm'), listaPend = raiz.querySelector('#lista-pendentes'), listaReg = raiz.querySelector('#lista-registradas'),
        filtro = raiz.querySelector('#filtro-reg');
  let itens = [];

  const mostrarAba = nome => {
    aba = nome;
    try { localStorage.setItem('central-aba', nome); } catch {}
    raiz.querySelectorAll('[role=tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.aba === nome));
    raiz.querySelectorAll('[role=tabpanel]').forEach(p => { p.hidden = p.id !== 'painel-' + nome; });
  };

  // registradas: um <details> por mês; os cartões só são montados quando o mês é aberto
  const montarMes = d => {
    const caixa = d.querySelector('.cartoes');
    if (!caixa.children.length) caixa.innerHTML = itens.filter(a => a.status !== 'pendente' && a.data.startsWith(d.dataset.mes)).map(cartao).join('');
  };
  const mesesHTML = (reg, abertos) => porMes(reg).map(([m, l], i) => {
    const total = l.reduce((s, a) => s + segundosDe(a), 0), aberto = abertos ? abertos.has(m) : i === 0;
    return `<details class="mes" data-mes="${m}"${aberto ? ' open' : ''}>
      <summary><span>${esc(mesExtenso(m))}</span><span class="meta">${l.length} ${l.length === 1 ? 'atividade' : 'atividades'} · ${fmtHoras(total)}</span></summary>
      <div class="cartoes">${aberto ? l.map(cartao).join('') : ''}</div></details>`;
  }).join('');
  const filtrar = () => {
    const termo = norm(filtro.value.trim());
    raiz.querySelectorAll('details.mes').forEach(d => {
      if (!termo) { d.hidden = false; d.querySelectorAll('.cartao').forEach(c => { c.hidden = false; }); return; }
      montarMes(d); d.open = true;
      let n = 0;
      d.querySelectorAll('.cartao').forEach(c => { const ok = norm(c.textContent).includes(termo); c.hidden = !ok; n += ok; });
      d.hidden = !n;
    });
  };
  listaReg.addEventListener('toggle', e => { if (e.target.open) montarMes(e.target); }, true); // toggle não borbulha; capture resolve
  filtro.addEventListener('input', filtrar);

  // resumo de quantidade e horas das registradas (total e mês atual); atualizado a cada segundo enquanto algo conta
  const resumoReg = raiz.querySelector('#resumo-reg'), mesAtual = hoje().slice(0, 7);
  const pintarResumo = () => {
    const reg = itens.filter(a => a.status !== 'pendente');
    resumoReg.hidden = !reg.length;
    raiz.querySelector('#n-reg-total').textContent = reg.length;
    raiz.querySelector('#h-reg-total').textContent = fmtHoras(reg.reduce((s, a) => s + segundosDe(a), 0));
    raiz.querySelector('#h-mes-total').textContent = fmtHoras(reg.filter(a => a.data.startsWith(mesAtual)).reduce((s, a) => s + segundosDe(a), 0));
  };

  const vazioPend = vazio({ icone: ICONE.ok, titulo: 'Tudo em dia', texto: 'Nenhuma pendência anotada. Registre o que falta fazer para não depender da memória.',
    acoes: '<button class="btn mini" data-novo="pendente">＋ Nova pendência</button><span class="nota">ou tecle N</span>' });
  const vazioReg = vazio({ titulo: 'Nenhuma atividade registrada', texto: 'Conclua uma pendência, lance uma atividade manual ou meça o tempo no modo foco.',
    acoes: '<button class="btn mini" data-novo="lancar">＋ Lançar atividade manual</button><a class="btn mini sec" href="#/foco">◉ Abrir modo foco</a>' });

  const carregar = async () => {
    try { itens = await listarAtividades(); }
    catch (e) { listaPend.innerHTML = listaReg.innerHTML = erroHTML('Não foi possível carregar as atividades.', e); return; }
    const pend = itens.filter(a => a.status === 'pendente').sort((a, b) => a.data.localeCompare(b.data) || a.criado_em.localeCompare(b.criado_em));
    const reg = itens.filter(a => a.status !== 'pendente');
    raiz.querySelector('#n-pend').textContent = pend.length; raiz.querySelector('#n-reg').textContent = reg.length;
    listaPend.innerHTML = pend.length ? `<div class="cartoes">${pend.map(cartao).join('')}</div>` : vazioPend;
    // mantém abertos os meses que já estavam abertos (ao recarregar depois de uma ação)
    const abertos = listaReg.querySelector('details.mes') ? new Set([...listaReg.querySelectorAll('details.mes[open]')].map(d => d.dataset.mes)) : null;
    if (abertos && reg[0]) abertos.add(reg[0].data.slice(0, 7)); // o mês mais recente sempre fica visível (é onde cai o que acabou de ser concluído)
    listaReg.innerHTML = reg.length ? mesesHTML(reg, abertos) : vazioReg;
    filtro.hidden = reg.length < 6;
    if (filtro.value) filtrar();
    pintarResumo();
  };

  raiz.addEventListener('click', async e => {
    const tab = e.target.closest('[role=tab]');
    if (tab) return mostrarAba(tab.dataset.aba);
    const novo = e.target.closest('[data-novo]');
    if (novo) {
      if (await modalAtividade(sb, { modo: novo.dataset.novo, aoSalvar: carregar })) toast(novo.dataset.novo === 'pendente' ? 'Pendência adicionada.' : 'Atividade registrada.');
      return;
    }
    const b = e.target.closest('[data-acao]');
    if (!b) return;
    const a = itens.find(x => x.id === b.closest('[data-id]').dataset.id);
    if (!a) return;
    try {
      if (b.dataset.acao === 'concluir') {
        const antes = { status: 'pendente', data: a.data, segundos: a.segundos, timer_inicio: a.timer_inicio };
        await concluirAtividade(sb, a);
        toast(`"${a.nome}" concluída e registrada hoje.`, { acao: 'Desfazer', aoClicar: async () => {
          const { error } = await sb.from('atividades').update(antes).eq('id', a.id);
          toast(error ? `Não foi possível desfazer: ${error.message}` : 'Voltou para as pendências.'); carregar();
        } });
      }
      else if (b.dataset.acao === 'editar') { if (!await modalAtividade(sb, { modo: 'editar', atividade: a })) return; toast('Atividade atualizada.'); }
      else if (b.dataset.acao === 'excluir') {
        if (!await confirmar({ titulo: 'Excluir atividade?', texto: `"${a.nome}" será apagada definitivamente.`, rotulo: 'Excluir', perigo: true })) return;
        const { error } = await sb.from('atividades').delete().eq('id', a.id);
        if (error) throw error;
        toast('Atividade excluída.');
      }
    } catch (err) { toast(`A operação falhou: ${err.message || err}`); }
    carregar();
  });

  raiz.querySelector('#sair').addEventListener('click', async () => { pararRelogio(); await sb.auth.signOut(); location.hash = '#/atividades'; });

  // atalho: N abre "Nova pendência" (fora de campos de texto e modais)
  const atalho = e => {
    if (e.key.toLowerCase() !== 'n' || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
    if (e.target instanceof Element && e.target.closest('input, textarea, select')) return;
    e.preventDefault(); mostrarAba('pendentes'); raiz.querySelector('.barra [data-novo="pendente"]').click();
  };
  document.addEventListener('keydown', atalho);
  aoSair.push(() => document.removeEventListener('keydown', atalho));

  mostrarAba(aba); ligarRelogio(() => { atualizarCronometros(itens); if (itens.some(a => a.timer_inicio)) pintarResumo(); }); carregar();
}

// ---------- modo foco ----------
const CR_CHAVE = 'central-cronometro';
const crLer = () => { try { const s = JSON.parse(localStorage.getItem(CR_CHAVE)); if (s && s.estado) return s; } catch {} return { estado: 'parado', acumulado: 0, inicio: null }; };
const crGravar = cr => { try { localStorage.setItem(CR_CHAVE, JSON.stringify(cr)); } catch {} };

async function foco(id) {
  document.title = 'Modo foco — Central de Sistemas';
  app.innerHTML = telaCarregando('#/admin', 'Administração');
  const sessao = await exigirSessao();
  if (!sessao) return;
  const { sb } = sessao;

  // atividade vinculada (opcional): o tempo vai direto para ela, no banco
  let a = null;
  if (id) {
    const { data, error } = await sb.from('atividades').select('*').eq('id', id).maybeSingle();
    if (error || !data) { app.querySelector('#conteudo').innerHTML = vazio({ titulo: 'Atividade não encontrada', texto: 'Ela pode ter sido excluída. Você ainda pode medir o tempo com o cronômetro livre.',
      acoes: '<a class="btn mini" href="#/foco">◉ Abrir o cronômetro livre</a><a class="btn mini sec" href="#/admin">Voltar ao painel</a>' }); return; }
    a = data;
  }
  let cr = a ? null : crLer(); // cronômetro livre fica neste navegador

  app.innerHTML = `<div class="foco">
    <a class="voltar" href="#/admin">← Administração</a>
    <div class="foco-centro" data-estado="parado">
      <p class="foco-tarefa">${a ? `Vinculado a ${a.status === 'pendente' ? 'pendência' : 'atividade'}<strong>${esc(a.nome)}</strong><span class="tags">${tagSistema(a)}</span>`
        : 'Cronômetro livre · não vinculado<span class="dica">Ao finalizar, você registra a atividade com o tempo medido.</span>'}</p>
      <span class="foco-chip" id="chip" role="status">Parado</span>
      <div class="relogio" id="relogio" aria-live="off">00:00:00</div>
      <p class="foco-sessao" id="sessao" hidden></p>
      <div class="foco-acoes" id="acoes"></div>
      <p class="foco-dica" id="dica"></p>
    </div></div>`;
  const centro = app.querySelector('.foco-centro'), chip = app.querySelector('#chip'), relogio = app.querySelector('#relogio'),
        sessaoEl = app.querySelector('#sessao'), acoes = app.querySelector('#acoes'), dica = app.querySelector('#dica');
  let ocupado = false;

  const segundos = () => a ? segundosDe(a) : cr.acumulado + (cr.inicio ? Math.max(0, Math.round((Date.now() - cr.inicio) / 1000)) : 0);
  const estado = () => a ? (a.timer_inicio ? 'rodando' : 'parado') : cr.estado;
  const rotulos = { parado: 'Parado', rodando: 'Contando', pausado: 'Pausado', finalizado: 'Finalizado' };

  // roda a cada segundo: relógio, chip de estado, sessão atual (modo vinculado) e título da aba
  const pintarTempo = () => {
    const s = segundos(), e = estado();
    relogio.textContent = fmtCron(s);
    centro.dataset.estado = e;
    chip.textContent = rotulos[e] + (a && e === 'parado' && s ? ' · total da atividade' : '');
    if (a && a.timer_inicio) {
      sessaoEl.hidden = false;
      sessaoEl.innerHTML = `Nesta sessão: <b>${fmtCron(Math.max(0, Math.round((Date.now() - new Date(a.timer_inicio)) / 1000)))}</b> · o relógio mostra o total da atividade`;
    } else sessaoEl.hidden = true;
    document.title = (e === 'rodando' ? fmtCron(s) + ' · ' : '') + 'Modo foco — Central de Sistemas';
  };

  const pintar = () => {
    pintarTempo();
    const e = estado(), s = segundos();
    let botoes, texto;
    if (a) {
      botoes = e === 'rodando'
        ? [['pausar', '❚❚ Pausar', 'sec'], ['finalizar', '■ Finalizar', '']]
        : [['iniciar', s ? '▶ Retomar' : '▶ Iniciar', ''], ...(a.status === 'pendente' ? [['concluir', '✓ Concluir', 'sec']] : [])];
      texto = e === 'rodando' ? 'O tempo é gravado na atividade e continua contando mesmo se você fechar esta aba. <kbd>Espaço</kbd> pausa.'
        : (a.status === 'pendente' ? 'Finalizar pausa o tempo e pergunta se a pendência foi concluída.' : 'Iniciar soma o tempo desta sessão ao total da atividade.') + ' <kbd>Espaço</kbd> inicia.';
    } else {
      botoes = { parado: [['iniciar', '▶ Iniciar', '']],
        rodando: [['pausar', '❚❚ Pausar', 'sec'], ['finalizar', '■ Finalizar', '']],
        pausado: [['retomar', '▶ Retomar', ''], ['finalizar', '■ Finalizar', 'sec'], ['descartar', 'Descartar', 'mini sec perigo segurar']],
        finalizado: [['registrar', 'Registrar atividade', ''], ['retomar', '▶ Retomar', 'sec'], ['descartar', 'Descartar', 'mini sec perigo segurar']] }[e];
      texto = { parado: 'Pressione <kbd>Espaço</kbd> para iniciar ou pausar.', rodando: 'O cronômetro continua contando se você recarregar a página.',
        pausado: 'Retome quando voltar à tarefa. Segure "Descartar" por 2 segundos para zerar.',
        finalizado: `Registre a atividade com ${fmtHoras(Math.max(60, s))} ou retome a contagem.` }[e];
    }
    acoes.innerHTML = botoes.map(([acao, rotulo, cls]) => `<button class="btn ${cls.includes('mini') ? cls : 'grande ' + cls}" data-acao="${acao}" ${cls.includes('segurar') ? 'title="Segure por 2 segundos"' : ''}>${rotulo}</button>`).join('');
    dica.innerHTML = texto;
    const seg = acoes.querySelector('.segurar');
    if (seg) segurar(seg, 2000, () => executar('descartar!'), { titulo: 'Zerar o cronômetro?', texto: `Você vai perder ${fmtHoras(Math.max(60, s))} medidos.`, rotulo: 'Zerar', perigo: true });
  };

  const recarregarAtividade = async () => {
    const { data } = await sb.from('atividades').select('*').eq('id', a.id).maybeSingle();
    if (data) a = data;
  };

  const executar = async acao => {
    if (ocupado) return;
    ocupado = true;
    try {
      if (a) { // vinculado: tudo no banco
        if (acao === 'iniciar') { await pausarTodos(sb, a.id); const { error } = await sb.from('atividades').update({ timer_inicio: new Date().toISOString() }).eq('id', a.id); if (error) throw error; }
        else if (acao === 'pausar') { const { error } = await sb.from('atividades').update({ segundos: segundosDe(a), timer_inicio: null }).eq('id', a.id); if (error) throw error; }
        else if (acao === 'finalizar' || acao === 'concluir') {
          if (a.timer_inicio) { const { error } = await sb.from('atividades').update({ segundos: segundosDe(a), timer_inicio: null }).eq('id', a.id); if (error) throw error; await recarregarAtividade(); }
          if (a.status === 'pendente' && await confirmar({ titulo: 'Concluir a pendência?', texto: `"${a.nome}" vai para as registradas com a data de hoje, com ${fmtHoras(segundosDe(a))} de trabalho.`, rotulo: 'Concluir' })) {
            await concluirAtividade(sb, a); toast('Pendência concluída.'); location.hash = '#/admin'; return;
          }
          if (acao === 'finalizar') { toast('Tempo salvo na atividade.'); location.hash = '#/admin'; return; }
        }
        await recarregarAtividade();
      } else { // livre: estado local
        if (acao === 'iniciar' || acao === 'retomar') { cr.inicio = Date.now(); cr.estado = 'rodando'; }
        else if (acao === 'pausar') { cr.acumulado = segundos(); cr.inicio = null; cr.estado = 'pausado'; }
        else if (acao === 'finalizar') { cr.acumulado = segundos(); cr.inicio = null; cr.estado = 'finalizado'; }
        else if (acao === 'descartar!') { cr = { estado: 'parado', acumulado: 0, inicio: null }; toast('Cronômetro zerado.'); }
        else if (acao === 'registrar') {
          if (await modalAtividade(sb, { modo: 'lancar', segundos: Math.max(60, Math.round(cr.acumulado / 60) * 60) })) { cr = { estado: 'parado', acumulado: 0, inicio: null }; toast('Atividade registrada.'); }
        }
        crGravar(cr);
      }
    } catch (err) { toast(`A operação falhou: ${err.message || err}`); }
    ocupado = false; pintar();
  };

  acoes.addEventListener('click', e => { const b = e.target.closest('[data-acao]'); if (b && !b.classList.contains('segurar')) executar(b.dataset.acao); });
  const tecla = e => {
    if (e.key !== ' ' || (e.target instanceof Element && e.target.closest('input, textarea, select, button, a, dialog'))) return;
    e.preventDefault();
    const s = estado();
    executar(s === 'rodando' ? 'pausar' : s === 'parado' ? 'iniciar' : 'retomar');
  };
  document.addEventListener('keydown', tecla);
  aoSair.push(() => { document.removeEventListener('keydown', tecla); document.title = 'Central de Sistemas — Comarca de Rio Real'; });

  pintar(); ligarRelogio(pintarTempo);
}

const aoSair = []; // limpezas executadas ao trocar de rota
function rota() {
  pararRelogio();
  aoSair.splice(0).forEach(fn => fn());
  const h = location.hash.slice(2);
  document.body.dataset.area = h === 'admin' || h === 'foco' || h.startsWith('foco/') ? 'admin' : 'publico'; // o CSS diferencia a área restrita
  if (h === 'atividades') return atividades();
  if (h === 'admin') return admin();
  if (h === 'foco' || h.startsWith('foco/')) return foco(h.slice(5) || null);
  const p = PROJETOS.find(p => p.slug === h);
  p ? detalhe(p) : catalogo();
}
addEventListener('hashchange', rota);
// lê os changelogs copiados por sync.mjs antes da primeira renderização; falhas não travam a página
Promise.allSettled(PROJETOS.filter(p => p.repo).map(p => lerMd(`changelog/${p.slug}.md`).then(v => { LOGS[p.slug] = v; }))).then(rota);
</script>
