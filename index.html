  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, "Segoe UI", sans-serif; }
  a { color: var(--brand); }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

  .topo { background: var(--topo); color: var(--topo-text); border-bottom: 3px solid #b08d3c; }
  .topo .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 16px; }
  .topo a { color: inherit; text-decoration: none; font: 700 1.2rem var(--serif); letter-spacing: .01em; }
  .topo span { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
  .topo :focus-visible { outline-color: #fff; }

  main { padding-block: 32px 64px; }
  h1, h2 { font-family: var(--serif); font-weight: 700; line-height: 1.25; }
  h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 8px; }
  h2 { font-size: 1.3rem; margin: 48px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); scroll-margin-top: 16px; }

  .status { font-size: .82rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .status::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--breve); }
  .status.ok::before { background: var(--ok); }

  .filtros { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
  .chip { font-size: .82rem; padding: 3px 10px; background: transparent; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
  .chip:hover { border-color: var(--brand); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-text); }
  .conta { font-size: .85rem; color: var(--muted); margin: 20px 0 10px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .card { display: flex; flex-direction: column; gap: 8px; padding: 20px; background: var(--surface); border: 1px solid var(--line);

  .card h3 { margin: 0; font: 700 1.1rem/1.3 var(--serif); color: var(--brand); }
  .card p { margin: 0; color: var(--muted); font-size: .92rem; flex: 1; }
  .card footer { display: flex; justify-content: space-between; gap: 8px; padding-top: 12px; margin-top: 4px; border-top: 1px solid var(--line); font-size: .82rem; color: var(--muted); }
  .vazio { color: var(--muted); padding: 24px 0; }

  .hero { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--brand); border-radius: 6px; padding: 28px; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: .85rem; color: var(--muted); margin-bottom: 14px; }
  .acoes { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 4px; }
  .btn { display: inline-block; padding: 15px 30px; font-size: 1.1rem; font-weight: 700; background: var(--btn); color: var(--btn-text);
         border: 2px solid var(--btn); border-radius: 6px; text-decoration: none; }
  .btn:hover { filter: brightness(1.15); }
  .btn.sec { background: transparent; color: var(--brand); font-size: 1rem; font-weight: 600; padding: 12px 20px; border-width: 1px; }
  .btn[aria-disabled="true"] { background: var(--line); border-color: var(--line); color: var(--muted); cursor: not-allowed; filter: none; }
  .nota { font-size: .88rem; color: var(--muted); margin: 14px 0 0; max-width: 68ch; }
  .secoes { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 16px; font-size: .9rem; }
  .secoes button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 10px; color: var(--muted); }
  .secoes button:hover { color: var(--text); border-color: var(--brand); }

  ol.passos { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
  ol.passos li { display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding: 18px 20px; }
  ol.passos li + li { border-top: 1px solid var(--line); }
  ol.passos .n { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--brand);
                 color: var(--brand); font: 700 .95rem var(--serif); }
  ol.passos strong { display: block; }
  ol.passos p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; max-width: 68ch; }
  .fig { display: block; margin: 12px 0 0; padding: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; overflow: hidden; max-width: 100%; }
  .fig img { display: block; max-width: 100%; max-height: 340px; height: auto; }
  .aviso { background: var(--aviso-bg); border-left: 3px solid var(--aviso-line); padding: 12px 16px; margin: 0 0 16px; border-radius: 0 4px 4px 0; font-size: .95rem; }

  details { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
  summary { padding: 13px 18px; font-weight: 600; cursor: pointer; }
  details p { margin: 0; padding: 0 18px 14px; color: var(--muted); }

  .versao { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .versao .quando { font-size: .88rem; color: var(--muted); }
  .versao .quando b { display: block; color: var(--text); font-size: 1rem; }
  .versao .atual { display: inline-block; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ok); font-weight: 700; }

  dialog img { display: block; max-width: 96vw; max-height: 92vh; cursor: zoom-out; border-radius: 4px; }

  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }

const norm = s => s.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
const dataBR = iso => iso.split('-').reverse().join('/');
const ordenadas = p => [...p.versoes].sort((a, b) => b.data.localeCompare(a.data));
const status = p => `<span class="status ${esc(p.status.tipo)}">${esc(p.status.rotulo)}</span>`;
const rotuloVersao = v => v.versao ? `v${esc(v.versao)}` : dataBR(v.data);

function card(p) {
  const v = ordenadas(p)[0];
  return `<a class="card" href="#/${esc(p.slug)}">
    <span class="tipo">${esc(p.tipo)}</span><h3>${esc(p.nome)}</h3><p>${esc(p.resumo)}</p>
    <footer>${status(p)}<span>Atualizado em ${dataBR(v.data)}</span></footer></a>`;
}

function catalogo() {
  document.title = 'Central de Sistemas — Comarca de Rio Real';
  const tags = [...new Set(PROJETOS.flatMap(p => p.tags))].sort((a, b) => a.localeCompare(b, 'pt'));
  app.innerHTML = `<h1>Sistemas e projetos da comarca</h1>
    <p class="sub">Links oficiais, instruções de uso e histórico de atualizações de cada sistema, em um só lugar.</p>
    <input class="busca" type="search" placeholder="Buscar por nome ou tag…" aria-label="Buscar sistema por nome ou tag">
    <div class="filtros" role="group" aria-label="Filtrar por tag">${tags.map(t => `<button class="chip" aria-pressed="false">${esc(t)}</button>`).join('')}</div>
    <p class="conta" aria-live="polite"></p><div class="grade"></div>`;
  const busca = app.querySelector('.busca'), grade = app.querySelector('.grade'), conta = app.querySelector('.conta');
  let tag = null;
  const filtrar = () => {
    const termo = norm(busca.value.trim());
    const achados = PROJETOS.filter(p => (!tag || p.tags.includes(tag)) && norm(p.nome + ' ' + p.tags.join(' ')).includes(termo));
    conta.textContent = `${achados.length} ${achados.length === 1 ? 'sistema' : 'sistemas'}`;
    grade.innerHTML = achados.map(card).join('') || '<p class="vazio">Nenhum sistema encontrado. Tente outro termo ou limpe o filtro.</p>';
  };
  busca.addEventListener('input', filtrar);
  app.querySelector('.filtros').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    tag = tag === chip.textContent ? null : chip.textContent;
    app.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.textContent === tag));
    filtrar();
  });
  filtrar();
}

function detalhe(p) {
  document.title = `${p.nome} — Central de Sistemas`;
  const versoes = ordenadas(p);
  const botao = p.acao.url
    ? `<a class="btn" href="${esc(p.acao.url)}" ${p.acao.arquivo ? 'download' : 'target="_blank" rel="noopener"'}>${p.acao.arquivo ? '↓ ' : ''}${esc(p.acao.rotulo)}${p.acao.arquivo ? '' : ' ↗'}</a>`
    : `<a class="btn" aria-disabled="true">${esc(p.acao.rotulo)} — em breve</a>`;
  let n = 0; // numeração contínua entre as seções do guia
  const guia = p.guia.map(g => `${g.secao ? `<h3 class="secao">${esc(g.secao)}</h3>` : ''}
    <ol class="passos">${g.passos.map(([t, d, img]) => `<li><span class="n" aria-hidden="true">${++n}</span><div>
      <strong>${esc(t)}</strong><p>${esc(d)}</p>
      ${img ? `<button class="fig" aria-label="Ampliar imagem: ${esc(t)}"><img src="${esc(img)}" alt="Tela: ${esc(t)}" loading="lazy"></button>` : ''}
    </div></li>`).join('')}</ol>`).join('');
  app.innerHTML = `<a class="voltar" href="#/">← Todos os sistemas</a>
    <section class="hero">
      <div class="meta">${status(p)}<span>${esc(p.tipo)}</span><span>Versão atual: ${rotuloVersao(versoes[0])}</span><span>Atualizado em ${dataBR(versoes[0].data)}</span></div>
      <h1>${esc(p.nome)}</h1>
      <p class="sub">${esc(p.resumo)}</p>
      <div class="acoes">${botao}${p.manual ? `<a class="btn sec" href="${esc(p.manual)}" target="_blank" rel="noopener">Manual completo (PDF)</a>` : ''}</div>
      ${p.nota ? `<p class="nota">${esc(p.nota)}</p>` : ''}
    </section>
    <nav class="secoes" aria-label="Seções da página">
      <button data-ir="como">Como funciona</button>${p.faq ? '<button data-ir="faq">Problemas comuns</button>' : ''}<button data-ir="versoes">Histórico de versões</button>
    </nav>
    <h2 id="como">Como funciona</h2>
    ${p.aviso ? `<p class="aviso"><strong>Atenção:</strong> ${esc(p.aviso)}</p>` : ''}
    ${guia}
    ${p.faq ? `<h2 id="faq">Problemas comuns</h2>${p.faq.map(([q, a]) => `<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}` : ''}
    <h2 id="versoes">Histórico de versões</h2>
    ${versoes.map((v, i) => `<div class="versao"><div class="quando"><b>${rotuloVersao(v)}</b>${v.versao ? dataBR(v.data) : ''}${i ? '' : '<span class="atual">Atual</span>'}</div>
      <ul>${v.notas.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}`;
  scrollTo(0, 0);
}

// cliques delegados: navegação entre seções e ampliação das imagens do tutorial
app.addEventListener('click', e => {
  const ir = e.target.closest('[data-ir]'), fig = e.target.closest('.fig');
  if (ir) document.getElementById(ir.dataset.ir).scrollIntoView();
  if (fig) { const im = fig.querySelector('img'); zoom.firstChild.src = im.src; zoom.firstChild.alt = im.alt; zoom.showModal(); }
});
zoom.addEventListener('click', () => zoom.close());

function rota() {
  const p = PROJETOS.find(p => p.slug === location.hash.slice(2));
  p ? detalhe(p) : catalogo();
}
addEventListener('hashchange', rota);
rota();
</script>
</body>
</html>
